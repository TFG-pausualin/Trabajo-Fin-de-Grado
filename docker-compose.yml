services:
  postgres:
    image: postgres:16-alpine
    container_name: tfg_postgres

    env_file:
      - .env

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tfg_videojuegos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    volumes:
      - tfg_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tfg_videojuegos}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped

volumes:
  tfg_postgres_data: